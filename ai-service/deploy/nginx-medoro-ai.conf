# /etc/nginx/sites-available/medoro-ai  (then: ln -s ../sites-available/medoro-ai /etc/nginx/sites-enabled/)
# HTTPS in front of the AI service. Ollama (11434) and the service (8090) listen on 127.0.0.1 only.
limit_req_zone $binary_remote_addr zone=medoro_ai:10m rate=60r/m;

server {
    listen 80;
    server_name ai.example.com;              # replace with the AI host's name
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name ai.example.com;
    ssl_certificate     /etc/letsencrypt/live/ai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 4m;                 # one spoken answer
    access_log off;                          # never log request bodies or tokens

    location ~ ^/(health|stt|tts|llm/classify)$ {
        limit_req zone=medoro_ai burst=20 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / { return 404; }
}
