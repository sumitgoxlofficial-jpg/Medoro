[package]
name = "medoro-desktop"
version = "1.0.0"
description = "Medoro pharmacy desktop app"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde_json = "1"

# Native message boxes for update prompts (rfd directly: tauri-plugin-dialog would replace
# window.alert/confirm on the server's pages with IPC calls those pages are not allowed to make).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
