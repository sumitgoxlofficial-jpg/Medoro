# Naina's voice on a laptop or PC that is already on (for example the one running the WhatsApp connector).
# Only the voice: Medoro itself stays on Vercel. About 1 GB of RAM and 70 MB of download.
#   Windows:  powershell -ExecutionPolicy Bypass -File scripts\voice\setup.ps1
#   Mac/Linux: bash scripts/voice/setup.sh
# Guide: docs/OFFICE_SERVER.md §10c
name: medoro-voice

services:
  ai-service:
    build: { context: ../../ai-service, args: { VOICE_ONLY: "1" } }
    image: medoro/ai-service:voice
    restart: unless-stopped
    environment:
      MEDORO_AI_TOKEN: ${AI_HR_SERVICE_TOKEN:?run scripts/voice/setup first}
      VOICE_ONLY: "1"
      OLLAMA_URL: http://127.0.0.1:9 # no local language model on this machine
    # Only this machine can reach it; Tailscale Funnel publishes it over HTTPS.
    ports:
      - "127.0.0.1:${MEDORO_VOICE_PORT:-8090}:8090"
    volumes:
      - voicemodels:/models
    deploy: { resources: { limits: { memory: 1g } } }
    logging: { driver: local, options: { max-size: "10m", max-file: "3" } }

volumes:
  voicemodels:
