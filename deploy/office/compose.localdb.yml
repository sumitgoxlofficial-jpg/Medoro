# Optional: keep the database on this machine instead of Supabase.
#   docker compose -f deploy/office/compose.yml -f deploy/office/compose.localdb.yml up -d
# Then backups are your job: the app's own encrypted backups (Settings → Backup) plus scripts/office/backup.sh.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: medoro
      POSTGRES_USER: medoro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.office}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medoro -d medoro"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No published port: only the app reaches the database.

  migrate:
    environment:
      DATABASE_URL: postgresql://medoro:${POSTGRES_PASSWORD}@db:5432/medoro
      DIRECT_URL: postgresql://medoro:${POSTGRES_PASSWORD}@db:5432/medoro
    depends_on:
      db: { condition: service_healthy }

  app:
    environment:
      DATABASE_URL: postgresql://medoro:${POSTGRES_PASSWORD}@db:5432/medoro
      DIRECT_URL: postgresql://medoro:${POSTGRES_PASSWORD}@db:5432/medoro
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
